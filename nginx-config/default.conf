server {
    listen 80;
    server_name www.openllm-france.chat openllm-france.chat;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name www.openllm-france.chat openllm-france.chat;

    ssl_certificate /etc/letsencrypt/live/openllm-france.chat/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/openllm-france.chat/privkey.pem;

    # Security headers and SSL settings
    include /etc/nginx/conf.d/ssl-params.conf;

    location / {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
